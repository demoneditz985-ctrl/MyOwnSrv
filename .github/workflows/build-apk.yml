name: Build Shadow Modz APK

permissions:
  contents: write

on:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned NDK and build-tools
        run: |
          SDK="$ANDROID_HOME"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
              "ndk;25.2.9519653" "build-tools;34.0.0" > /dev/null
          echo "NDK=$SDK/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "BT=$SDK/build-tools/34.0.0"  >> "$GITHUB_ENV"

      - name: Build native libVM.so (both ABIs)
        run: |
          set -e
          MAIN="src/PAPAJI EVIEL SRC/app/src/main"
          # ndk-build/make choke on spaces ("PAPAJI EVIEL SRC"), so build from
          # a space-free copy of the jni tree.
          rm -rf /tmp/vmbuild && mkdir -p /tmp/vmbuild
          cp -r "$MAIN/jni" /tmp/vmbuild/jni
          # CI runners are case-sensitive: Main.cpp includes "ImGui/Toggle.h"
          # but the folder on disk is lowercase "imgui".
          # keep the wildcard *.c* in Android.mk from compiling the .bak copy
          rm -f /tmp/vmbuild/jni/Main.cpp.bak
          if ! "$NDK/ndk-build" -j4 \
              NDK_PROJECT_PATH=/tmp/vmbuild \
              APP_BUILD_SCRIPT=/tmp/vmbuild/jni/Android.mk \
              NDK_APPLICATION_MK=/tmp/vmbuild/jni/Application.mk \
              > /tmp/ndkbuild.log 2>&1; then
            echo "===== ndk-build FAILED ====="; tail -60 /tmp/ndkbuild.log; exit 1
          fi
          tail -20 /tmp/ndkbuild.log
          ls -la /tmp/vmbuild/libs/arm64-v8a /tmp/vmbuild/libs/armeabi-v7a
          mkdir -p "$MAIN/libs/arm64-v8a" "$MAIN/libs/armeabi-v7a"
          cp /tmp/vmbuild/libs/arm64-v8a/libVM.so   "$MAIN/libs/arm64-v8a/"
          cp /tmp/vmbuild/libs/armeabi-v7a/libVM.so "$MAIN/libs/armeabi-v7a/"

      - name: Assemble unsigned APK
        run: |
          set -e
          ROOT="$(pwd)"
          MAIN="src/PAPAJI EVIEL SRC/app/src/main"
          BIN="src/PAPAJI EVIEL SRC/app/build/bin"
          STAGE="build-apk/stage"
          rm -rf build-apk && mkdir -p "$STAGE"
          # prebuilt compiled resources (binary manifest + resources.arsc + res)
          (cd "$STAGE" && unzip -q -o "$ROOT/$BIN/resources.ap_")
          cp "$BIN/classes.dex" "$STAGE/"
          mkdir -p "$STAGE/lib/arm64-v8a" "$STAGE/lib/armeabi-v7a"
          cp "$MAIN/libs/arm64-v8a/libVM.so"   "$STAGE/lib/arm64-v8a/"
          cp "$MAIN/libs/armeabi-v7a/libVM.so" "$STAGE/lib/armeabi-v7a/"
          (cd "$STAGE" && zip -q -r ../unaligned.apk .)
          ls -la build-apk/

      - name: Zipalign + sign
        run: |
          set -ex
          cd build-apk
          { keytool -genkeypair -keystore shadow.keystore -storepass android \
              -keypass android -alias shadowmodz -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Shadow Modz, OU=Dev, O=ShadowModz, C=IN" \
            && "$BT/zipalign" -f 4 unaligned.apk aligned.apk \
            && "$BT/apksigner" sign --ks shadow.keystore --ks-pass pass:android \
              --key-pass pass:android --out ShadowModz.apk aligned.apk ; } > /tmp/sign.log 2>&1 \
            || { echo "SIGN FAILED"; cat /tmp/sign.log; exit 1; }
          cat /tmp/sign.log

      - name: Verify APK
        run: |
          set -x
          cd build-apk
          "$BT/apksigner" verify --verbose ShadowModz.apk
          "$BT/aapt" dump badging ShadowModz.apk | head -8
          unzip -l ShadowModz.apk

      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir -p ci-logs
          cp /tmp/ndkbuild.log /tmp/sign.log ci-logs/ 2>/dev/null || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-logs
          git commit -q -m "ci: publish build log [skip ci]" || echo "no log to commit"
          git push origin "HEAD:${{ github.ref_name }}" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowModz-apk
          path: build-apk/ShadowModz.apk

      - name: Deliver APK via branch (downloadable through git)
        run: |
          mkdir -p release
          cp build-apk/ShadowModz.apk release/ShadowModz.apk
          cp build-apk/unaligned.apk /dev/null 2>/dev/null || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f release/ShadowModz.apk
          git commit -q -m "ci: deliver ShadowModz.apk [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
